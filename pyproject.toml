[project]
name = "HackathonJaJo"
description = ""
requires-python = ">=3.11"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
numpy = ">=2.0.0"
pandas = ">=2.0.0"
xarray = "*"
geopandas = ">=1.0.1"

[tool.pixi.tasks]
python = "python"
check-env = "python -c 'import xarray, pandas, geopandas; print(\"environment OK\")'"

# --- metocean feature: extra packages for metocean statistics ---
[tool.pixi.feature.metocean.dependencies]
windrose = "*"
scipy    = ">=1.13"
cmocean  = "*"

[tool.pixi.feature.metocean.tasks]
python         = "python"
check-metocean = "python -c 'import windrose, scipy, cmocean; print(\"metocean environment OK\")'"

# --- named environments ---
[tool.pixi.environments]
default  = { features = [],           solve-group = "default" }
metocean = { features = ["metocean"], solve-group = "metocean" }